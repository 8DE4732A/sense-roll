[project]
name = "sense-roll"
description = "API Key Rotation Proxy"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "jsonpath-ng>=1.8.0",
]

[project.scripts]
sense-roll = "sense_roll.main:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
artifacts = [
  "sense_roll/web/dist/**/*",
  "sense_roll/web/dist/*",
]

[tool.hatch.build.targets.wheel]
packages = ["sense_roll"]
artifacts = [
  "sense_roll/web/dist/**/*",
  "sense_roll/web/dist/*",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
