providers:
  # -----------------------------------------------------------------------
  # SenseNova：同一组 key 同时支持 OpenAI 和 Anthropic 两种格式
  # -----------------------------------------------------------------------
  - name: sensenova
    api:
      - api_format: openai          # → POST {base_url}/chat/completions
        base_url: "https://token.sensenova.cn/v1"
      - api_format: anthropic       # → POST {base_url}/messages
        base_url: "https://token.sensenova.cn/v1"
    max_retries: 3
    key_strategy: "fill-first"      # fill-first | round-robin
    keys:
      - key: "sk-sn-xxxx-1"
      - key: "sk-sn-xxxx-2"
    health_check_rules:
      # deepseek-v4-flash 的 5 小时额度限制（per key per model）
      - description: "quota_exceeded_flash"
        jsonpath: "$.error.type"
        match_value: "quota_exceeded_error"
        match_type: "equals"        # equals | contains | regex
        action: "rotate"
        cooldown_seconds: 18000     # 5 小时
        models: ["deepseek-v4-flash"]  # 空列表 = 适用所有模型
      # RPM 限速（适用所有模型，冷却 60 秒）
      - description: "rpm_exhausted"
        jsonpath: "$.error.message"
        match_value: "rpm exhausted"
        match_type: "contains"
        action: "rotate"
        cooldown_seconds: 60
        models: []

  # -----------------------------------------------------------------------
  # DeepSeek 官网：支持 OpenAI Chat Completions + Responses API
  # -----------------------------------------------------------------------
  - name: deepseek
    api:
      - api_format: openai          # → POST {base_url}/chat/completions
        base_url: "https://api.deepseek.com/v1"
      - api_format: openai-responses  # → POST {base_url}/responses
        base_url: "https://api.deepseek.com/v1"
    max_retries: 3
    key_strategy: "round-robin"
    keys:
      - key: "sk-ds-xxxx-1"
    health_check_rules:
      - description: "rate_limit"
        jsonpath: "$.error.type"
        match_value: "rate_limit_exceeded"
        match_type: "equals"
        action: "rotate"
        cooldown_seconds: 60
        models: []

combos:
  # -----------------------------------------------------------------------
  # OpenAI Chat Completions 格式 combo
  # 客户端传 model="fast" 即可；代理自动路由并改写真实 model 字段
  # -----------------------------------------------------------------------
  - name: "fast"
    api_format: openai              # 单个字符串或列表均可
    strategy: "fill-first"         # fill-first 优先第一个 member，耗尽才切换
    members:
      - provider: sensenova
        model: "deepseek-v4-flash"
      - provider: deepseek          # sensenova 耗尽后的备用
        model: "deepseek-chat"

  # -----------------------------------------------------------------------
  # Anthropic Messages 格式 combo
  # 客户端发到 POST /v1/messages，model="fast-ant"
  # -----------------------------------------------------------------------
  - name: "fast-ant"
    api_format: anthropic
    strategy: "fill-first"
    members:
      - provider: sensenova
        model: "deepseek-v4-flash"

  # -----------------------------------------------------------------------
  # OpenAI Responses API 格式 combo
  # 客户端发到 POST /v1/responses，model="fast-resp"
  # -----------------------------------------------------------------------
  - name: "fast-resp"
    api_format: openai-responses
    strategy: "fill-first"
    members:
      - provider: deepseek
        model: "deepseek-chat"

  # -----------------------------------------------------------------------
  # 多格式 combo：同一个 combo 名同时服务 openai 和 anthropic 请求
  # -----------------------------------------------------------------------
  - name: "smart"
    api_format:
      - openai
      - anthropic
    strategy: "fill-first"
    members:
      - provider: sensenova
        model: "deepseek-v4-0324"

# ---------------------------------------------------------------------------
# Payload 改写脚本列表（可选，默认为空）
# 按顺序执行，前一个脚本的修改结果传给下一个；disabled 脚本自动跳过
# ---------------------------------------------------------------------------
payload_scripts:
  # -----------------------------------------------------------------------
  # 脚本 1：删除可能暴露客户端信息的 headers
  # -----------------------------------------------------------------------
  - name: "隐藏客户端标识"
    enabled: true
    script: |
      request.headers.pop('user-agent', None)
      request.headers.pop('User-Agent', None)
      request.headers.pop('x-client-version', None)
      request.body.pop('x_client_info', None)

  # -----------------------------------------------------------------------
  # 脚本 2：对 fast combo 限制 thinking 预算（当前已禁用，方便复用时开启）
  # -----------------------------------------------------------------------
  - name: "fast combo 限制 thinking 预算"
    enabled: false
    script: |
      if request.combo == 'fast' and 'thinking' in request.body:
          request.body['thinking']['budget_tokens'] = min(
              request.body['thinking'].get('budget_tokens', 8000), 1024
          )
